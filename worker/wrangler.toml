name = "echo-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Stockage des paires et du jeton OAuth en cache.
# Créer le namespace avec : npx wrangler kv namespace create ECHO_KV
# puis remplacer l'id ci-dessous par celui affiché.
[[kv_namespaces]]
binding = "ECHO_KV"
id = "REMPLACER_PAR_ID_KV"

# Limitation de débit native de Cloudflare (gratuite, appliquée par point de présence).
# Envois d’échos : 40 par minute et par paire (l’appli impose déjà 5 s entre deux envois par téléphone).
[[ratelimits]]
name = "PING_LIMITER"
namespace_id = "4201"
simple = { limit = 40, period = 60 }

# Création / saisie de code : 10 par minute et par IP.
[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "4202"
simple = { limit = 10, period = 60 }

[observability]
enabled = true

# Secret à définir (jamais dans ce fichier) :
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT < compte-de-service.json
